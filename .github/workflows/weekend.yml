name: weekend-agg
run-name: weekend-agg (Sat/Sun basis for Monday boards)
permissions:
  contents: write
on:
  schedule:
    # 周六/周日 (6=Sat,0=Sun) UTC 04:30=北京12:30 ，13:30=北京21:30
    - cron: '30 4 * * 6,0'
    - cron: '30 13 * * 6,0'
  workflow_dispatch:
    inputs:
      forceWeekend:
        description: '手动触发一次周末整合(等同周六/周日)'
        default: '1'
jobs:
  agg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: weekend fetch + aggregate + push
        shell: bash
        env:
          WEEKEND: '1'
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITEE_REPO: https://gitee.com/ys15251239086/shuobao-gitee.git
          GITEE_BRANCH: master
          GITEE_USER: ys15251239086
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN || github.token }}
          BD_APPID: ${{ secrets.BD_APPID }}
          BD_KEY: ${{ secrets.BD_KEY }}
        run: bash run.sh
