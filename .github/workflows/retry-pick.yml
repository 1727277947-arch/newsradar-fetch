name: retry-daily-pick
run-name: backstop: retry daily board pick if missing
permissions:
  contents: write
on:
  schedule:
    # Beijing 04:00 = UTC 20:00(prev day): 30min after the 03:30 early pick
    - cron: '0 20 * * *'
    # Beijing 12:35 = UTC 04:35: 30min after the 12:00 midday pick
    - cron: '30 4 * * *'
    # Beijing 20:35 = UTC 12:35: 30min after the 20:00 evening pick
    - cron: '30 12 * * *'
  workflow_dispatch:
jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check whether today pick already exists
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          export TZ=Asia/Shanghai
          TODAY=$(date +%Y-%m-%d)
          echo "today=$TODAY"
          url="https://gitee.com/api/v5/repos/ys15251239086/shuobao-gitee/contents/data/prices.json?ref=master&access_token=${GITEE_TOKEN}"
          echo "skip=false" > /tmp/flag
          if curl -fsS "$url" > /tmp/gitee_pr.json 2>/dev/null; then
            python3 - "$TODAY" <<'PY'
import json,sys,base64
today=sys.argv[1]
raw=json.load(open('/tmp/gitee_pr.json',encoding='utf-8'))
try:
    s=base64.b64decode(raw.get('content','') or '').decode('utf-8','replace')
    o=json.loads(s)
    dp=o.get('daily_pick') or {}
    has_dp=bool(dp) and str(dp.get('date',''))==today
except Exception:
    has_dp=False
open('/tmp/flag','w').write('skip=true\n' if has_dp else 'skip=false\n')
PY
          else
            echo "gitee probe failed; assume missing so we will run the backstop fetch."
          fi
          echo "decision=$(cat /tmp/flag)" >> $GITHUB_ENV
      - name: Run fetch + full sync (only when today pick missing)
        if: env.decision != 'skip=true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITEE_REPO: https://gitee.com/ys15251239086/shuobao-gitee.git
          GITEE_BRANCH: master
          GITEE_USER: ys15251239086
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN || github.token }}
          BD_APPID: ${{ secrets.BD_APPID }}
          BD_KEY: ${{ secrets.BD_KEY }}
        run: bash run.sh