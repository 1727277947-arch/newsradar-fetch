name: auto-fetch
run-name: auto-fetch news+prices
permissions:
  contents: write
on:
  schedule:
    - cron: '0 0,2,4,6,10,12,14,18,22 * * *'   # 北京 08/10/12/14(2h) 18/22/02/06(4h)
    - cron: '0 20 * * *'                        # Beijing 04:00  (30min backstop after 03:30 early pick)
    - cron: '30 19 * * *'                       # 北京 03:30 每日打板主推(早盘)
    - cron: '0 12 * * *'                        # 北京 20:00 每日打板主推(晚盘)
    - cron: '30 4 * * *'                        # Beijing 12:30  (30min backstop after 12:00 midday)
    - cron: '30 12 * * *'                       # Beijing 20:30  (30min backstop after 20:00 evening)
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run fetch + push
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITEE_REPO: https://gitee.com/ys15251239086/shuobao-gitee.git
          GITEE_BRANCH: master
          GITEE_USER: ys15251239086
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN || github.token }}
          BD_APPID: ${{ secrets.BD_APPID }}
          BD_KEY: ${{ secrets.BD_KEY }}
        run: bash run.sh



