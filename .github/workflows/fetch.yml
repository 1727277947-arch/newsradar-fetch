name: auto-fetch
run-name: auto-fetch news+prices
permissions:
  contents: write
on:
  schedule:
    # 说明：GitHub Actions 的定时任务在整点(尤其 ":00")排队最严重，实测可延迟 30 分钟以上甚至整档丢失。
    # 因此所有关键档都避开整点分钟，并把每档的兜底档错开 25~35 分钟。
    # 兜底不只靠 cron：fetch_prices.py 会对比 data/prices.json 的 updated_at，
    # 若距上次成功更新过久(打板档 >75 分钟)，本次即便不是打板时刻也会重算打板，避免漏档后无数据。
    - cron: '0 0,2,4,6,10,12,14,18,22 * * *'   # 北京 08/10/12/14(2h) 18/22/02/06(4h)
    - cron: '7 16 * * *'                       # 北京 00:07 基于已收盘昨日的现货/日线定版当日晨判
    - cron: '37 19 * * *'                      # 北京 03:37 每日打板主推(早盘)  ← 原 03:30
    - cron: '12 20 * * *'                      # 北京 04:12 早盘兜底            ← 原 04:00
    - cron: '43 3 * * *'                       # 北京 11:43 午后板重算          ← 原 11:40
    - cron: '13 4 * * *'                       # 北京 12:13 午后板兜底          ← 原 12:30
    - cron: '23 12 * * *'                      # 北京 20:23 每日打板主推(晚盘)  ← 原 20:00
    - cron: '53 12 * * *'                      # 北京 20:53 晚盘兜底            ← 原 20:30
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run fetch + push
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITEE_REPO: https://gitee.com/ys15251239086/shuobao-gitee.git
          GITEE_BRANCH: master
          GITEE_USER: ys15251239086
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN || github.token }}
          BD_APPID: ${{ secrets.BD_APPID }}
          BD_KEY: ${{ secrets.BD_KEY }}
        run: bash run.sh



